<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        h1,
        h2,
        h3,
        .brand-font {
            font-family: 'Poppins', sans-serif;
        }

        .boxInput:focus-within {
            border-color: #6d4aff;
            box-shadow: 0 0 0 3px rgba(109, 74, 255, 0.15);
        }
    </style>
</head>

<body class="bg-[#fafafc] min-h-screen">

    <header>
        <div class="border-b border-[#eee9ff] h-17 flex items-center bg-white/80 backdrop-blur-sm sticky top-0 z-10">
            <div class="img">
                <img src="img/Untitled (400 x 300 px) (400 x 200 px) (1).png" class="h-14 ml-6">
            </div>
        </div>
    </header>

    <div class="flex flex-col items-center px-4 pb-20 justify-center items-center">

        <!-- CONTAINER -> ESCOLHENDO QUAL PERFIL IRÁ USAR -->
        <div id="containerChoice"
            class="border border-[#eee9ff] w-full max-w-[600px] rounded-2xl shadow-lg shadow-purple-100 mt-16 md:mt-24 bg-gradient-to-b from-purple-100 to-purple-50 flex flex-col text-center overflow-hidden">
            <div class="pt-10 pb-4 px-8">
                <h2 class="font-semibold text-3xl text-[#3e2f5b] brand-font">Seja bem-vindo!</h2>
                <h2 class="font-medium text-lg text-[#6b7280] mt-1">Registre-se!</h2>
            </div>
            <div class="w-full pb-10 px-8">
                <h3 class="text-[#3e2f5b] font-semibold mb-6 text-sm tracking-wide uppercase opacity-80">Escolha uma das
                    opções abaixo</h3>
                <div class="buttons flex flex-col gap-3 items-center">
                    <button id="choiceEmployee" type="button"
                        class="border border-[#eee9ff] rounded-xl w-full max-w-[400px] h-[60px] text-lg font-semibold text-[#3e2f5b] hover:bg-[#6d4aff] hover:text-white hover:border-[#6d4aff] transition-colors duration-200 cursor-pointer flex justify-center items-center shadow-md bg-white">
                        Quero vender meu serviço!</button>
                    <button id="choiceClient" type="button"
                        class="border border-[#eee9ff] rounded-xl w-full max-w-[400px] h-[60px] text-lg font-semibold text-[#3e2f5b] hover:bg-[#6d4aff] hover:text-white hover:border-[#6d4aff] transition-colors duration-200 cursor-pointer flex justify-center items-center shadow-md bg-white">
                        Quero contratar um serviço!</button>
                </div>
            </div>
        </div>


        <!-- CONTAINER -> PERFIL EMPLOYEE -> REGISTRO -->
        <div id="containerEmployeeRegister" class="w-full flex items-center justify-center">
            <div
                class="border border-purple-200 flex flex-col rounded-2xl bg-white shadow-lg shadow-purple-100 w-full max-w-[600px] mt-10 items-center px-6 py-10">
                <h2 class="font-semibold text-3xl text-[#3e2f5b] brand-font">Seja bem-vindo!</h2>
                <h2 class="font-medium text-lg text-[#6b7280] mt-1">Registre-se!</h2>
                <form id="formEmployee" class="w-full flex justify-center">
                    <div class="flex flex-col mt-8 gap-3 items-center w-full">
                        <div
                            class="boxInput rounded-lg border border-[#e5e0fa] h-[50px] bg-[#fafafc] flex items-center w-full max-w-[400px] px-5 transition-all duration-150">
                            <input required
                                class="text-[#3e2f5b] placeholder-[#9ca3af] bg-transparent outline-none w-full text-sm"
                                placeholder="Nome completo" id="empNomeCompleto" type="text">
                        </div>
                        <div
                            class="boxInput rounded-lg border border-[#e5e0fa] h-[50px] bg-[#fafafc] flex items-center w-full max-w-[400px] px-5 transition-all duration-150">
                            <input required
                                class="text-[#3e2f5b] placeholder-[#9ca3af] bg-transparent outline-none w-full text-sm"
                                placeholder="Email - example@email.com" id="empEmail" type="email">
                        </div>

                        <div
                            class="boxInput rounded-lg border border-[#e5e0fa] h-[50px] bg-[#fafafc] flex items-center w-full max-w-[400px] px-5 transition-all duration-150">
                            <input required
                                class="text-[#3e2f5b] placeholder-[#9ca3af] bg-transparent outline-none w-full text-sm"
                                placeholder="Telefone - 00 9 0000-0000" id="empTelefone" type="tel">
                        </div>

                        <div
                            class="boxInput rounded-lg border border-[#e5e0fa] h-[50px] bg-[#fafafc] flex items-center w-full max-w-[400px] px-5 transition-all duration-150">
                            <input required
                                class="text-[#3e2f5b] placeholder-[#9ca3af] bg-transparent outline-none w-full text-sm"
                                placeholder="CNPJ - 00.000.000/0000-00" id="empCnpj" type="text">
                        </div>

                        <div
                            class="boxInput rounded-lg border border-[#e5e0fa] h-[50px] bg-[#fafafc] flex items-center w-full max-w-[400px] px-5 transition-all duration-150">
                            <input required
                                class="text-[#3e2f5b] placeholder-[#9ca3af] bg-transparent outline-none w-full text-sm"
                                placeholder="Tipo de serviço" id="empTipoServico" type="text">
                        </div>

                        <div
                            class="boxInput rounded-lg border border-[#e5e0fa] h-[50px] bg-[#fafafc] flex items-center w-full max-w-[400px] px-5 transition-all duration-150">
                            <input required
                                class="text-[#3e2f5b] placeholder-[#9ca3af] bg-transparent outline-none w-full text-sm"
                                placeholder="Nome da empresa" id="empNomeEmpresa" type="text">
                        </div>

                        <div
                            class="boxInput rounded-lg border border-[#e5e0fa] h-[50px] bg-[#fafafc] flex items-center w-full max-w-[400px] px-5 transition-all duration-150">
                            <input required
                                class="text-[#3e2f5b] placeholder-[#9ca3af] bg-transparent outline-none w-full text-sm"
                                placeholder="Senha" id="empSenha" type="password">
                        </div>

                        <button id="empButtonRegistrar"
                            class="h-[45px] hover:bg-[#5a37e6] active:scale-[0.98] cursor-pointer w-full max-w-[400px] mt-3 rounded-xl text-white text-center flex items-center font-semibold justify-center bg-[#6d4aff] transition-all duration-150 shadow-md shadow-purple-200">Cadastrar</button>

                    </div>
                </form>
            </div>
        </div>

        <!-- CONTAINER -> REGISTER NEW CLIENT -->
        <div id="containerClientRegister" class="w-full flex justify-center">
            <div
                class="border border-purple-200 flex flex-col rounded-2xl bg-white shadow-lg shadow-purple-100 w-full max-w-[600px] mt-10 items-center px-6 py-10">
                <h2 class="font-semibold text-3xl text-[#3e2f5b] brand-font">Seja bem-vindo!</h2>
                <h2 class="font-medium text-lg text-[#6b7280] mt-1 mb-8">Registre-se!</h2>
                <form id="formClient" class="w-full flex justify-center">
                    <div class="flex flex-col gap-3 items-center w-full">

                        <div
                            class="boxInput rounded-lg border border-[#e5e0fa] h-[50px] bg-[#fafafc] flex items-center w-full max-w-[400px] px-5 transition-all duration-150">
                            <input required
                                class="text-[#3e2f5b] placeholder-[#9ca3af] bg-transparent outline-none w-full text-sm"
                                placeholder="Nome completo" id="clientNomeCompleto" type="text">
                        </div>

                        <div
                            class="boxInput rounded-lg border border-[#e5e0fa] h-[50px] bg-[#fafafc] flex items-center w-full max-w-[400px] px-5 transition-all duration-150">
                            <input required
                                class="text-[#3e2f5b] placeholder-[#9ca3af] bg-transparent outline-none w-full text-sm"
                                placeholder="Email - example@email.com" id="clientEmail" type="email">
                        </div>

                        <div
                            class="boxInput rounded-lg border border-[#e5e0fa] h-[50px] bg-[#fafafc] flex items-center w-full max-w-[400px] px-5 transition-all duration-150">
                            <input required
                                class="text-[#3e2f5b] placeholder-[#9ca3af] bg-transparent outline-none w-full text-sm"
                                placeholder="Telefone - 00 9 0000-0000" id="clientTelefone" type="tel">
                        </div>

                        <div
                            class="boxInput rounded-lg border border-[#e5e0fa] h-[50px] bg-[#fafafc] flex items-center w-full max-w-[400px] px-5 transition-all duration-150">
                            <input required
                                class="text-[#3e2f5b] placeholder-[#9ca3af] bg-transparent outline-none w-full text-sm"
                                placeholder="Endereco - Rua 2 Av. Três" id="clientEndereco" type="text">
                        </div>

                        <div
                            class="boxInput rounded-lg border border-[#e5e0fa] h-[50px] bg-[#fafafc] flex items-center w-full max-w-[400px] px-5 transition-all duration-150">
                            <input required
                                class="text-[#3e2f5b] placeholder-[#9ca3af] bg-transparent outline-none w-full text-sm"
                                placeholder="CPF - 111.222.333-44" id="clientCPF" type="text">
                        </div>

                        <div
                            class="boxInput rounded-lg border border-[#e5e0fa] h-[50px] bg-[#fafafc] flex items-center w-full max-w-[400px] px-5 transition-all duration-150">
                            <input required
                                class="text-[#3e2f5b] placeholder-[#9ca3af] bg-transparent outline-none w-full text-sm"
                                placeholder="Senha" id="clientSenha" type="password">
                        </div>

                        <button id="clientButtonRegistrar"
                            class="h-[45px] hover:bg-[#5a37e6] active:scale-[0.98] cursor-pointer w-full max-w-[400px] mt-3 rounded-xl text-white text-center flex items-center font-semibold justify-center bg-[#6d4aff] transition-all duration-150 shadow-md shadow-purple-200">Cadastrar</button>
                    </div>
                </form>
            </div>
        </div>

        <script src="js/userRegister.js"></script>
    </div>
</body>

</html>
