<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Coop+</title>
</head>

<body>

    <header>
        <div class="border-1 border-[#eee9ff] h-17 justify-start items-center flex">
            <div class="img">
                <img src="img/Untitled (400 x 300 px) (400 x 200 px) (1).png" class="h-20 ml-6">
            </div>
        </div>
    </header>

    <div class="justify-center flex">
        <div class="flex  items-center align-middle justify-center m-auto">
            <img src="img/Untitled (700 x 500 px).png" class=" h-[800px]">
            <div
                class="h-[700px] w-[500px] rounded-xl border-[#eee9ff] shadow-lg border-1 flex flex-col justify-center items-center ">
                <div class="titles mt-30 text-center flex-col  ">
                    <h2 class="font-semibold text-[30px] text-[#3e2f5b] ">Seja bem-vindo!</h2>
                    <h3 class="font-semibold text-[20px] text-[#6b7280]">Registre-se!</h3>
                </div>
                <div class="h-[500px] mt-20 w-full">
                    <div id="containerChoices" class="flex flex-col justify-center align-middle items-center">
                        <h2 class="text-[15px] w-[200px] font-semibold text-center text-[#6d4aff] ">Escolha uma das
                            opções
                            abaixo!</h2>
                        <button
                            class="mt-5 w-[250px] h-[60px] bg-[#eee9ff] rounded-full font-bold text-[] text-[#3e2f5b] hover:bg-[#fafafc] cursor-pointer shadow-lg"
                            id="choice_1">Quero vender meu serviço!</button>
                        <button
                            class="w-[250px] h-[60px] bg-[#eee9ff] rounded-full font-bold text-[] text-[#3e2f5b] hover:bg-[#fafafc] cursor-pointer shadow-lg mt-4"
                            id="choice_2">Quero contratar um serviço!</button>
                    </div>
                </div>
            </div>
        </div>
    </div>


<script src="js/userRegister.js"></script>
</body>

</html>
